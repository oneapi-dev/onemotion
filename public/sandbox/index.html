<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!--
      The sandbox for scenes written by a model. It is loaded in an iframe with
      sandbox="allow-scripts" (an opaque origin: no storage, no cookies, no
      access to the Studio). This policy lets it reach nothing but this app's
      static files and Google Fonts, so a scene cannot send anything anywhere.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-eval'; connect-src 'self' blob: data: https://fonts.gstatic.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' data: blob:; worker-src blob:; form-action 'none'; base-uri 'none'"
    />
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0b0c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/sandbox/runtime/main.js"></script>
  </body>
</html>
